name: Release packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to build and update
        required: true
        type: string

permissions:
  contents: read

env:
  QT_VERSION: 6.8.*
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  linux-appimage:
    name: Linux AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends ninja-build libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libfuse2 file patchelf gnupg

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          cache: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install into AppDir
        run: cmake --install build --prefix "$GITHUB_WORKSPACE/AppDir/usr"

      - name: Download linuxdeploy tools
        run: |
          curl --fail --location --retry 3 --output linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl --fail --location --retry 3 --output linuxdeploy-plugin-qt-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Import AppImage signing key
        env:
          LINUX_GPG_PRIVATE_KEY_BASE64: ${{ secrets.LINUX_GPG_PRIVATE_KEY_BASE64 }}
        run: |
          if [[ -z "$LINUX_GPG_PRIVATE_KEY_BASE64" ]]; then
            echo "::error::The LINUX_GPG_PRIVATE_KEY_BASE64 Actions secret is required for release signing"
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          install -d -m 700 "$GNUPGHOME"
          key_file="$RUNNER_TEMP/jetson-control-release-key.gpg"
          printf '%s' "$LINUX_GPG_PRIVATE_KEY_BASE64" | base64 --decode > "$key_file"
          gpg --batch --import "$key_file"
          rm -f "$key_file"
          signing_key="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          if [[ -z "$signing_key" ]]; then
            echo "::error::No secret GPG signing key was imported"
            exit 1
          fi
          echo "LDAI_SIGN=1" >> "$GITHUB_ENV"
          echo "LDAI_SIGN_KEY=$signing_key" >> "$GITHUB_ENV"

      - name: Build AppImage
        env:
          APPIMAGETOOL_SIGN_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          ARCH: x86_64
          NO_STRIP: "1"
        run: |
          if [[ -z "$APPIMAGETOOL_SIGN_PASSPHRASE" ]]; then
            echo "::error::The LINUX_GPG_PASSPHRASE Actions secret is required for release signing"
            exit 1
          fi
          mkdir -p dist
          safe_tag="${RELEASE_TAG//\//-}"
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export LINUXDEPLOY_OUTPUT_VERSION="${RELEASE_TAG#v}"
          export LDAI_OUTPUT="$GITHUB_WORKSPACE/dist/jetson-control-${safe_tag}-linux-x86_64.AppImage"
          APPIMAGE_EXTRACT_AND_RUN=1 ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file packaging/linux/jetson-control.desktop \
            --icon-file packaging/linux/jetson-control.svg \
            --plugin qt \
            --output appimage
          test -s "$LDAI_OUTPUT"
          test -n "$("$LDAI_OUTPUT" --appimage-signature)"
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$APPIMAGETOOL_SIGN_PASSPHRASE" \
            --local-user "$LDAI_SIGN_KEY" \
            --armor --detach-sign \
            --output "$LDAI_OUTPUT.asc" \
            "$LDAI_OUTPUT"
          gpg --batch --verify "$LDAI_OUTPUT.asc" "$LDAI_OUTPUT"
          gpg --batch --armor --export "$LDAI_SIGN_KEY" > dist/jetson-control-release-signing-key.asc

      - name: Upload Linux package
        uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: |
            dist/*.AppImage
            dist/*.AppImage.asc
            dist/jetson-control-release-signing-key.asc
          if-no-files-found: error

  windows-installer:
    name: Windows installer
    runs-on: windows-2022

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Install and deploy Qt runtime
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix "$env:GITHUB_WORKSPACE\package"
          if ($LASTEXITCODE -ne 0) { throw "CMake installation failed" }
          windeployqt --release --compiler-runtime --no-translations "$env:GITHUB_WORKSPACE\package\bin\jetson-control.exe"
          if ($LASTEXITCODE -ne 0) { throw "Qt runtime deployment failed" }

          # MSVC release builds need the redistributable installed on the target.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $visualStudio = & $vswhere -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $visualStudio) {
            throw "Visual Studio 2022 installation was not found"
          }
          $redist = Join-Path $visualStudio 'VC\Redist\MSVC\v143\vc_redist.x64.exe'
          Copy-Item -LiteralPath $redist -Destination "$env:GITHUB_WORKSPACE\package\vc_redist.x64.exe" -ErrorAction Stop

      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\dist" | Out-Null
          $safeTag = $env:RELEASE_TAG -replace '[^0-9A-Za-z._-]', '-'
          $version = $env:RELEASE_TAG -replace '^v', ''
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = @(
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            throw "Inno Setup compiler was not found on the runner"
          }
          $isccArguments = @(
            "/DMyAppVersion=$version"
            "/DMySourceDir=$env:GITHUB_WORKSPACE\package\bin"
            "/DMyOutputDir=$env:GITHUB_WORKSPACE\dist"
            "/DMyOutputBaseFilename=jetson-control-$safeTag-windows-x86_64-setup"
            "$env:GITHUB_WORKSPACE\packaging\windows\jetson-control.iss"
          )
          & $iscc @isccArguments
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

      - name: Test Windows installation, shortcuts, launch, and uninstall
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path dist -Filter '*-windows-x86_64-setup.exe')
          if ($installers.Count -ne 1) { throw "Expected exactly one Windows installer" }
          ./packaging/windows/test-install.ps1 -InstallerPath $installers[0].FullName

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error

  publish-assets:
    name: Attach packages to release
    needs: [linux-appimage, windows-installer]
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum *.AppImage *.AppImage.asc *.exe jetson-control-release-signing-key.asc > SHA256SUMS.txt

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/*.AppImage dist/*.AppImage.asc dist/*.exe dist/jetson-control-release-signing-key.asc dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
